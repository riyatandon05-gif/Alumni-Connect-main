<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Profile</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo">🌐 Portal Panel</div>
    <nav>
      <ul>
         <li><a href="index.html">Home</a></li>
         <li><a href="institute.html" class="active">Overview</a></li>
        <li><a href="institute.html#updates">Updates</a></li>
        <li><a href="institute.html#alumni">Alumni Network</a></li>
        <li><a href="institute.html#partnerships">Partnerships</a></li>
        <li>
          <div class="profile-dropdown">
            <button class="profile-dropbtn">Profile ▼</button>
            <div class="profile-dropdown-content">
              <a href="modify-profile.html">Modify Profile</a>
              <a href="view-profile.html">View Profile</a>
            </div>
          </div>
        </li>
        
        <li><a href="#" id="logoutBtn">Logout</a></li>
      </ul>
    </nav>
  </header>

  <section class="section">
  <h2>Your Profile</h2>
  <div class="profile-card">
    <p><strong>Name:</strong> Admin</p>
    <p><strong>Role:</strong> Institute</p>
    <p><strong>Email:</strong> admin@univ.edu</p>
    <a href="institute.html" class="btn-secondary" style="margin-top:20px;display:inline-block;">← Back to Dashboard</a>
  </div>
</section>
  <script src="dashboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let user = null;
      try { user = JSON.parse(localStorage.getItem('currentUser') || 'null'); } catch {}
      if (!user) return;
      const card = document.querySelector('.profile-card');
      card.innerHTML = `<p><strong>Name:</strong> ${user.name}</p><p><strong>Role:</strong> ${user.role}</p><p><strong>Email:</strong> ${user.email}</p><a href="institute.html" class="btn-secondary" style="margin-top:20px;display:inline-block;">← Back to Dashboard</a>`;
    });
  </script>
</body>
</html>
